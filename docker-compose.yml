services:
  smart-circuit:
    build: .
    # image: ghcr.io/kevdog114/smart-circuit:main
    ports:
      - "3001:3001"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=3001
      - DATABASE_URL=postgresql://smartcircuit:smartcircuitpass@postgres:5432/smartcircuit
    volumes:
      - smart-circuit-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    # Port mapped to 5433 to avoid conflicts; internal port remains 5432
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=smartcircuit
      - POSTGRES_USER=smartcircuit
      - POSTGRES_PASSWORD=smartcircuitpass
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcircuit -d smartcircuit"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  smart-circuit-data:
  postgres-data:
